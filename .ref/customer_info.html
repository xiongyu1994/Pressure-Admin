    <body style="background: #f8f8f8">
        <div class="layui-fluid">
            <div class="layui-row">
                <form class="layui-form">
                    <input type="hidden" name="id" id="id" value="227">
                    <div class="layui-form-item">
                        <label class="layui-form-label">账号</label>
                        <div class="layui-input-block">
                            <input disabled="" type="text" name="account" value="whyh_006"placeholder="请输入" autocomplete="off" class="layui-input" lay-verify="account">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="password" placeholder="请输入" autocomplete="off" class="layui-input"  lay-verify="password|pass">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">重复密码</label>
                        <div class="layui-input-block">
                            <input type="password" name="repassword" placeholder="请输入" autocomplete="off" class="layui-input"  lay-verify="repassword|pass">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <label class="layui-form-label">签名</label>
                        <div class="layui-input-block">
                            <div class="david_scimg" id="logo_tu">
                                                                <a href="http://cloud.shkfjxc.cn//static/upload/20251125/1764044663392.png" target="view_window"><img src="http://cloud.shkfjxc.cn//static/upload/20251125/1764044663392.png" /></a>
                                
                            </div>
                            <button class="david_tgbu" type="button" id="test1">上传签名</button>
                            <input type="hidden" name="sign" id="sign" value="http://cloud.shkfjxc.cn//static/upload/20251125/1764044663392.png">
                        </div>
                    </div>
                    <div class="layui-form-item">
                        <button class="layui-btn david_dabtn" lay-filter="add" lay-submit="">确认提交</button>
                    </div>
                </form>
            </div>
        </div>
         
        <script>
    	var flag = true;
        layui.use(['form', 'layer','table','upload'],
            function() {
               $ = layui.jquery;
            var form = layui.form,
                table = layui.table,
                layer = layui.layer,
                upload = layui.upload;

                //自定义验证规则
                form.verify({
                    required: function(value, item){ //value：表单的值、item：表单的DOM对象
				      if(!value){
				        return '此项是必填的，不可不选'; //这里的提示信息可以根据需要进行自定义
				      }
				    },
                    password:function(value,item){
                        if (!value) return;
                        if (!value) {
                            return '请输入密码';
                        }
                    },
                    repassword:function(value,item){
                        if (!$('input[name=password]').val()) return;

                        if ($('input[name=password]').val() !== value)
                        {
                            return '两次密码输入不一致！';
                        }

                    },
                    pass: [
                        /^[\S]{6,12}$/,
                        '密码必须6到12位，且不能出现空格'
                    ]
                });




               
                //监听提交
                form.on('submit(add)',
                function(data) {
                	
                    console.log('data',data);
                    console.log('data.field',data.field);

                    if (flag) {
                        flag = false;
                        $.ajax({
                            url: '/examination/system/system_action',
                            type: 'post',
                            data: data.field,
                            dataType: 'json',
                            success: function(data) {
                            flag = true;
                                if (data.code == 0) {
                                    //发异步，把数据提交给php
                                    layer.alert("成功", {
                                            icon: 6
                                        },
                                        function() {
                                            //关闭当前frame
                                            xadmin.close();

                                            // 可以对父窗口进行刷新 
                                            xadmin.father_reload();
                                        });
                                } else {
                                    layer.msg(data.message,{icon: 5,anim: 6});
                                }
                            },
                            error: function(data) {
                                flag = true;
                                layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                            }
                        });
                    }
                    return false;
                });

                var uploadInst = upload.render({
                    elem: '#test1' //绑定元素
                    ,size: 20400 //限制文件大小，单位 KB
                    ,accept: 'file' //音频
                    ,exts: 'jpg|png|gif|jpeg' //音频
                    ,url: '/manager/Uploadfiles/upload' //上传接口
                    ,done: function(res){
                        //如果上传失败
                        if(res.code > 0){
                            return layer.msg('上传失败',{icon: 5,anim: 6});
                        }
                      var loading = layer.msg('正在处理', {icon: 16, shade: 0.3, time:0});
                      $('#sign').val(res.data.file_url)
                      $('#logo_tu').html(' <a href="'+res.data.file_url+'" target="view_window"><img src="'+res.data.file_url+'" /></a>')
                      layer.close(loading);
                    }
                    ,error: function(){
                        return layer.msg('上传失败',{icon: 5,anim: 6});
                    }
                });

            });</script>
    </body>
