    <script>
    	function refresh() {
		    location.href = "/examination/system/system_user_list.html";
		}
    	layui.use('laydate',
        function() {
            var laydate = layui.laydate;

            //执行一个laydate实例
            laydate.render({
                elem: '#start_time' //指定元素
            });

            //执行一个laydate实例
            laydate.render({
                elem: '#end_time' //指定元素
            });

        });</script>
    <script>layui.use('table',
        function() {
            var table = layui.table;
            var form = layui.form;

        //状态切换监听
        form.on('switch(statusSwitch)', function(obj) {
            var status = 1;
            var id = obj.value;
            if (obj.elem.checked == true) {
                status = 1;
            } else {
                status = 0;
            }
            $.ajax({
                url: '/examination/system/edit_system_status',
                type: 'post',
                data: { "id": id, "status": status },
                dataType: 'json',
                success: function(data) {
                    if (data.code == 0) {
                        return layer.msg('成功',{icon: 1,anim: 6});
                    } else {
                        return layer.msg(data.message,{icon: 5,anim: 6});
                    }
                },
                error: function(data) {
                    layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                }
            });
        });
            
        table.on('tool(test)', function(obj){
            console.log(obj)
             var data = obj.data;
             if (obj.event == 'del') {
                layer.confirm('确认要删除吗？',function(index){
                      //发异步删除数据
                      $.ajax({
                        url: '/examination/system/system_delete',
                        type: 'post',
                        data: { "id": data.id },
                        dataType: 'json',
                        success: function(data) {
                            if (data.code == 0) {
                                obj.del();
                                layer.msg('已删除!',{icon:1,time:1000});
                            } else {
                                return layer.msg(data.message,{icon: 5,anim: 6});
                            }
                        },
                        error: function(data) {
                            layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                        }
                    });
                      
                  });
             }
        })
            
        });</script>
