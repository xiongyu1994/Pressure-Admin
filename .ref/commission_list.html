            socket.onclose = function() {

            };

        batchPrintingServer();

            table.render({
                url: '/examination/commission/get_commission_list',

                    status : '',
                    applicant : '',

                elem:'#dataTable',

                    var cols = [

                        {toolbar: '#operationBar',width:374,fixed: 'left',align:'center',title:'操作'},

                        // {field:'address', minWidth:150,title:'使用单位地址'},
                        {field:'client', minWidth:150,title:'单位联系人', templet : function(row){
                            if(row.device_contacts) return row.device_contacts
                            return row.client;
                        }},
                        // {field:'client_tel', minWidth:150,title:'单位电话'},
                        {field:'completed_num',title:'校验编号', templet : function(row){
                            if(row.first_order_code)
                            {
                                if(row.first_order_code == row.last_order_code)
                                {
                                    return row.first_order_code;
                                }
                                else
                                {
                                    return row.first_order_code + ' - ' + row.last_order_code
                                }
                            }
                            return '';
                        }},

                        {field:'completed_num', width:150,templet: '#baogaoStatus',title:'报告完成状态'},

                        
                    ];
                    var local = layui.data('table-get_commission_list'); // 获取对应的本地记录
                    layui.each(cols, function(index, item) {
                        if (item.field in local) {
                            item.hide = local[item.field];
                        }
                    });
                    return cols;
                }()],
                done: function() {
                    // 记录筛选状态
                    var that = this;
                    that.elem.next().on('mousedown', 'input[lay-filter="LAY_TABLE_TOOL_COLS"]+', function() {
                        var input = $(this).prev()[0];
                        // 此处表名可任意定义
                        layui.data('table-safetyvalve_list', {
                            key: input.name,
                            value: input.checked
                        })
                    });
                }
            })

            //状态切换监听
            form.on('switch(statusSwitch)', function(obj) {
                var status = 1;
                var id = obj.value;
                if (obj.elem.checked == true) {
                    status = 1;
                } else {
                    status = 0;
                }
                $.ajax({
                    url: '/examination/customer/edit_customer_status',
                    type: 'post',
                    data: {
                        "id": id,
                        "status": status

                    dataType: 'json',

                        if (data.code == 0) {

                        } else {
