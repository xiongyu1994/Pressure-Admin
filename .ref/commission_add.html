		    let onScan = function(e) {
		    	let nextTime = new Date().getTime();
		    	//当输入是回车且时间间隔小于50毫秒时候且页面焦点不是input输入框时候,让此节点丢失焦点
		    	if (e.keyCode == 13 && nextTime - lastTime <= 5 && document.activeElement.nodeName != 'INPUT') {
		    		document.activeElement.blur();
		    	}
		    	let code = e.keyCode;
		    	let key = e.key;
		    	if (code != 123 && code != 108 && code != 13 && code != 16) {
		    		// 处理 Alt 码格式
		    		if (typeof key === 'string' && key.indexOf('Alt') === 0) {
		    			// 提取 Alt 码中的数字
		    			let altMatch = key.match(/Alt(\d+)/);
		    			if (altMatch && altMatch[1]) {
		    				let charCode = parseInt(altMatch[1], 10);
		    				key = String.fromCharCode(charCode);
		    			}
		    		}

		    		if (codeString == "") {
		    			isScanInputStart = true;
		    			codeString += key;
		    			// console.log(isScanInputStart,key);
		    		} else if (nextTime - lastTime <= 50) {
		    			codeString += key;
		    			// console.log(isScanInputStart,key);
		    		} else {
		    			isScanInputStart = false;
		    			codeString = "";
		    		}
		    		if (key == "Unidentified") {
		    			isScanInputStart = false;
		    			codeString = "";
		    		}
		    	}
		    	// console.log(nextTime - lastTime);
		    	lastTime = nextTime;
		    };

		    	}
		    	onScan(e);
		    	//当前按键为回车 且字符串不为空时 触发扫码器输入方法
		    	if (isScanInputStart && e.which == 13 && codeString.length > 0) {
		    		// console.log('准备执行onScanInput', codeString);
		    		onScanInput(codeString); //do something
		    		isScanInputStart = false;
		    		codeString = ""; //回车输入后清空
		    	}

	    function onScanInput(text)
	    {
	    	console.log('原始scan:' + text);

	    	// 解析 Alt 码格式（如：Alt104Alt116Alt116...）
	    	let decodedText = "";
	    	let i = 0;
	    	while (i < text.length) {
	    		// 查找 "Alt" 标记
	    		if (text.substring(i, i + 3) === 'Alt') {
	    			i += 3; // 跳过 "Alt"
	    			// 收集后续数字
	    			let numStr = "";
	    			while (i < text.length && /\d/.test(text[i])) {
	    				numStr += text[i];
	    				i++;
	    			}
	    			// 转换为字符
	    			if (numStr.length > 0) {
	    				let charCode = parseInt(numStr, 10);
	    				decodedText += String.fromCharCode(charCode);
	    			}
	    		} else {
	    			// 普通字符直接添加
	    			decodedText += text[i];
	    			i++;
	    		}
	    	}

	    	console.log('解析后scan:' + decodedText);

		    var pattern = new RegExp('.*/q/([a-zA-Z0-9]+)');
		    var result = decodedText.match(pattern);

	    					});
	    				}
	    			});

	    function member_del(obj, id) {
	    	layer.confirm('确认要删除吗？', function(index) {
	    		$(obj).parents("tr").remove();
	    		let wei_id = $('#wei_ids').val();
	    		$('#wei_ids').val(wei_id.replace(id + ',', ''))
	    		layer.msg('已删除!', {
	    			icon: 1,
	    			time: 1000
	    		});
	    	});
	    }


	    function member_copy(obj, id) {
