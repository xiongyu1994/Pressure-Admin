        <script>
    	var flag = true;
        layui.use(['form', 'layer','table','upload'],
            function() {
               $ = layui.jquery;
            var form = layui.form,
                table = layui.table,
                layer = layui.layer,
                upload = layui.upload;

                //自定义验证规则
                form.verify({
                    required: function(value, item){ //value：表单的值、item：表单的DOM对象
				      if(!value){
				        return '此项是必填的，不可不选'; //这里的提示信息可以根据需要进行自定义
				      }
				    },
                    account:function(value,item){
                        if (!value) {
                            return '请输入账号';
                        }
                    },
                    name:function(value,item){
                        if (!value) {
                            return '请输入姓名';
                        }
                    },
                    phone:function(value,item){
                        if (!value) {
                            return '请输入手机号';
                        }
                    },
                    adminType:function(value,item){
                        if (!value) {
                            return '请选择身份';
                        }
                    }
                });




               
                //监听提交
                form.on('submit(add)',
                function(data) {
                	
                    var site_ids = '';
                    $('.site_ids:checked').each(function() {
                        site_ids+= $(this).val()+',';
                    });
                    if (site_ids.length < 1) {
                        layer.msg('至少选择一个站点', {
                            icon: 5,
                            anim: 6
                        });
                        return false;
                    }

                    if (flag) {
                        flag = false;
                        data.field.site_ids = site_ids;
                        $.ajax({
                            url: '/examination/system/system_action',
                            type: 'post',
                            data: data.field,
                            dataType: 'json',
                            success: function(data) {
                            flag = true;
                                if (data.code == 0) {
                                    //发异步，把数据提交给php
                                    layer.alert("成功", {
                                            icon: 6
                                        },
                                        function() {
                                            //关闭当前frame
                                            xadmin.close();

                                            // 可以对父窗口进行刷新 
                                            xadmin.father_reload();
                                        });
                                } else {
                                    layer.msg(data.message,{icon: 5,anim: 6});
                                }
                            },
                            error: function(data) {
                                flag = true;
                                layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                            }
                        });
                    }
                    return false;
                });

                var uploadInst = upload.render({
                    elem: '#test1' //绑定元素
                    ,size: 20400 //限制文件大小，单位 KB
                    ,accept: 'file' //音频
                    ,exts: 'jpg|png|gif|jpeg' //音频
                    ,url: '/manager/Uploadfiles/upload' //上传接口
                    ,done: function(res){
                        //如果上传失败
                        if(res.code > 0){
                            return layer.msg('上传失败',{icon: 5,anim: 6});
                        }
                      var loading = layer.msg('正在处理', {icon: 16, shade: 0.3, time:0});
                      $('#sign').val(res.data.file_url)
                      $('#logo_tu').html(' <a href="'+res.data.file_url+'" target="view_window"><img src="'+res.data.file_url+'" /></a>')
                      layer.close(loading);
                    }
                    ,error: function(){
                        return layer.msg('上传失败',{icon: 5,anim: 6});
                    }
                });

            });</script>
