        <script>
        layui.use('laydate',function() {

        $('[name=parity]').on('change',function(){
            if($('[name=parity]:checked').val() == '在线校验')
            {
                $('[name*=tightness_press],[name*=testing_pressure],[name*=testing_pressure2],[name*=testing_pressure3]').val('/');
                $('[name*=bubble_count]').val('');



            }
            else
            {
                $('[name=tightness_press],[name=testing_pressure],[name=testing_pressure2],[name=testing_pressure3]').each(function(item){
                    console.log($(this));
                    console.log($(this).data('val'));
                    console.log($(this).attr('data-val'));
                    $(this).val($(this).data('val'));
                });
            }

        });

        
        $('[name=parity]').trigger('change');
        

        function col_templet(data)
        {
            if(this.field == 'bubble')
            {

                return '\
                <div class="layui-input-group">\
                    <input type="text" name="data['+data.id+'][bubble_count]" value="0" placeholder="" autocomplete="off" class="layui-input " >\
                    <input type="hidden" name="data['+data.id+'][tightness_press]" value="'+data.tightness_press+'" placeholder="" autocomplete="off" class="layui-input " >\
                    <div class="layui-input-split layui-input-suffix">气泡数/min</div>\
                </div>';
            }


            var val

            switch(this.field)
            {
                case 'set_pressure1':
                case 'set_pressure2':
                case 'set_pressure3':
                    val = data.set_press;
                    break;

                case 'testing_pressure':
                case 'testing_pressure2':
                case 'testing_pressure3':
                    val = data.tightness_press;
                    break;
                
            }

            return '<div class="layui-input-group">\
                <input type="text" name="data['+data.id+']['+this.field+']" value="'+val+'" placeholder="请输入" autocomplete="off" class="layui-input " lay-verify="required" >\
                <div class="layui-input-split layui-input-suffix">MPa</div>\
            </div>';
        }

        layui.use(['table','layer', 'element','dropdown'], function() {
            var table = layui.table;
            var dropdown = layui.dropdown;
            table.render({
                url: "/examination/workorder/getDataList",
                method:'post',
                where:{
                    ids:'1'
                },
                css: '.layui-table-header .layui-table-cell{height: auto;white-space: normal;}',
                elem:'#dataTable',
                defaultToolbar: [],
                page: false,
                id: 'dataTable',
                height:640,
                page: true,
                limit: 9999,
                limits: [9999],
                cols:[
                    [

                        {type:'numbers ', maxWidth:50, align:'center', rowspan:2, title:'#',templet:function(data){
                            return data.LAY_NUM;
                        }},
                        {field:'order_code',  align:'center', rowspan:2, title:'校验编号'},
                        {field:'set_press', width:100, align:'center', rowspan:2, title:'要求整定压力MPa'},
                        {field:'tightness_press', width:100, align:'center', rowspan:2, title:'要求密封压力MPa'},
                        {align:'center', colspan:3, title:'整定压力'},
                        {align:'center', colspan:4, title:'密封压力'},
                    ],
                    [

                        {minWidth: 140, field:'set_pressure1',  align:'center', title:'第一次',templet:col_templet},
                        {minWidth: 140, field:'set_pressure2',  align:'center', title:'第二次',templet:col_templet},
                        {minWidth: 140, field:'set_pressure3',  align:'center', title:'第三次',templet:col_templet},
                        {minWidth: 140, field:'testing_pressure',  align:'center', title:'第一次',templet:col_templet},
                        {minWidth: 140, field:'testing_pressure2',  align:'center', title:'第二次',templet:col_templet},
                        {minWidth: 140, field:'testing_pressure3',  align:'center', title:'第三次',templet:col_templet},
                        {minWidth: 60, field:'bubble',  align:'center', title:'泄漏率',templet:col_templet},
                    ]

                ]
            });
        });



        var flag = true;
        layui.use(['form', 'layer'],
            function() {
                $ = layui.jquery;
                var form = layui.form,
                layer = layui.layer;

                $('#qita').on('change',function(){
                    if($(this).val())
                    {
                        $('.site_ids[cd=-1]').attr('checked',true);
                    }
                    else
                    {
                        $('.site_ids[cd=-1]').removeAttr('checked');
                    }
                    form.render('checkbox');
                });

                //自定义验证规则
                form.verify({
                    required: function(value, item){ //value：表单的值、item：表单的DOM对象
                      if(!value){
                        return '此项是必填的，不可不选'; //这里的提示信息可以根据需要进行自定义
                      }
                    },
                    equip_type:function(value,item){
                        if (!value) {
                            return '请选择设备类型';
                        }
                    },

                    test_media:function(value,item){
                        if(!value) return '请输入校验介质';
                    },
                    test_temprature:function(value,item){
                        if(!value) return '请输入校验介质温度';
                    },
                    visual_examination:function(value,item){
                        if(!value) return '请输入外观检查';
                    },
                    disassembly_inspection:function(value,item){
                        if(!value) return '请输入拆卸检查';
                    },
                    standard_number:function(value,item){
                        if(!value) return '请输入执行标准';
                    },
                   
                });

                /**/
                //监听提交
                form.on('submit(add)',function(data) {
                let address_json = [];
                $('.site_ids').each(function(){
                    let contents = '';
                    if ($(this).val() == '其他' && $(this).prop('checked')) {
                        contents = $('#qita').val();
                    }


                    let bb = {'id':$(this).attr('cd'),'category_name':$(this).val(),'contents':contents,'xuan': $(this).prop('checked') ? 1 : 2};
                        address_json.push(bb);
                    })
                    if (flag) {
                        flag = false;
                        data.field.json = JSON.stringify(address_json);
                        data.field.standard_number = $('#standard_number').val().join(';');
                        $.ajax({
                            url: '/examination/workorder/workorder_all_action',
                            type: 'post',

                            dataType: 'json',
                            success: function(data) {
                            flag = true;
                                if (data.code == 0) {
                                    //发异步，把数据提交给php
                                    layer.alert("提交成功", {
                                            icon: 6
                                        },
                                        function() {
                                            //关闭当前frame
                                            xadmin.close();

                                            /**/

                                            // 可以对父窗口进行刷新 
                                            xadmin.father_reload();
                                        });
                                } else {
                                    layer.msg(data.message,{icon: 5,anim: 6});
                                }
                            },
                            error: function(data) {
                                flag = true;
                                layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                            }
                        });
                    }
                    return false;
                });

            });</script>
