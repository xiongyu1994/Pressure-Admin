        // 3. 处理多个小数点（只保留第一个）
        value = value.replace(/\.+/g, (match, offset) => offset === value.indexOf('.') ? '.' : '');
        if (value != '/') {
            // 4. 保障至少两位小数（核心逻辑）

                const [intPart, decPart] = value.split('.');

            } else if (value) {
                value += ".00"; // 整数补充两位小数
            }
        }
        $(this).val(value);
    });

    $('#set_press').on('change', function() {
        let value = $(this).val();
        // 1. 清除非法字符（保留数字和小数点）
        value = value.replace(/[^\d.]/g, "");
        // 2. 处理首字符为小数点的情况（自动补零）
        if (value.startsWith('.')) value = "0" + value;
        // 3. 处理多个小数点（只保留第一个）
        value = value.replace(/\.+/g, (match, offset) => offset === value.indexOf('.') ? '.' : '');
        // 4. 保障至少两位小数（核心逻辑）
        if (value.includes('.')) {
            const [intPart, decPart] = value.split('.');
            // 关键修改：不再截断decPart，只对不足两位的补零
            value = intPart + '.' + (decPart.length >= 2 ? decPart : decPart + '0'.repeat(2 - decPart.length));
        } else if (value) {
            value += ".00"; // 整数补充两位小数
        }
        $(this).val(value)
        if (value <= 0.3) {
            if(ceilToTwoDecimals(new Decimal(value ).minus(new Decimal(0.03)).toString()) <= 0 )
            {
                $('#tightness_press').val(0);
            }
            else
            {
                $('#tightness_press').val(ceilToTwoDecimals(new Decimal(value ).minus(new Decimal(0.03)).toString()));
            }

        } else {
            $('#tightness_press').val(ceilToTwoDecimals(new Decimal(value ).times(new Decimal(0.9)).toString()));
        }

    })
