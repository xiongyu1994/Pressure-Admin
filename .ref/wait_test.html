<script>
    function refresh() {
        location.href = "/examination/workorder/wait_test.html?status=1";
    }
    layui.use('laydate',
    function() {

<script>
var tableWhere = {
            status : 1,
            code : '',
            order_code : '',
            cust_id : '',
            cust_name : '',
            manu_no : '',
            applicant : '',
            create_time_start : '',
            create_time_end : '',
        };
layui.use('table',function() {
    var table = layui.table;
    table.render({
        url: "/examination/workorder/get_workorder_list",
        where:tableWhere,
        elem:'#dataTable',
        defaultToolbar: ['filter'],
        page: true,
        toolbar: '#toolbarDemo',
        id: 'dataTable',
        limits: [15, 30, 60, 100 , 200 , 500 , 1000 , 2000],
        limit: 500,
        title: '工单列表',
        height:640,
        cols:[function (){

            var cols = [
                //表头
                {toolbar: '#operationBar',width:140,fixed: 'left',align:'center', title:'操作'},
                {type:'checkbox',fixed: 'left',width:80, align:'center', title:'复选'},
                {field:'status_name',fixed: 'left', minWidth:100, align:'center', title:'状态'},
                {field:'id_no', minWidth:150, align:'center', title:'设备代码', fixed: 'left'},
                {field:'order_code', fixed: 'left',minWidth:120, title:'检验编号',sort:true},

                {field:'set_press', minWidth:120, align:'center', title:'要求整定压力MPa',sort:true},
                {field:'update_time', minWidth:80,title:'状态时间',sort:true},
                {field:'code', minWidth:80,title:'委托单号',sort:true},
                {field:'manu_no', minWidth:120,title:'出厂编号',sort:true},
                {field:'cust_name', minWidth:150,title:'使用单位'},
                {field:'client', minWidth:150,title:'使用单位联系人', templet : function(row){
                    if(row.device_contacts) return row.device_contacts
                    return row.client;
                }},
                {field:'client_tel',minWidth:120,title:'使用单位联系电话'},
                {field:'equip_type', minWidth:80, align:'center', title:'设备类型', hide:true},
                {field:'tightness_press', minWidth:120, align:'center', title:'密封试验压力MPa', hide:true},
                {field:'tag_no', minWidth:100, align:'center', title:'安装位置', hide:true},
                {field:'vavle_model', minWidth:120, align:'center', title:'安全阀型号', hide:true},
                {field:'manufacturer', minWidth:120, align:'center', title:'制造单位', hide:true},
                {field:'license_no', minWidth:120, align:'center', title:'制造许可证号', hide:true},
                {field:'working_media', minWidth:120, align:'center', title:'工作介质', hide:true},
                {field:'diameter_nominal', width:50, align:'center', title:'公称通径mm', hide:true},
                {field:'seat_size', width:50, align:'center', title:'流道直径mm', hide:true},
                {field:'press_nominal', width:50, align:'center', title:'公称压力MPa', hide:true},
                {field:'working_press', width:50, align:'center', title:'工作压力MPa', hide:true},
                {field:'vavle_type', width:50, align:'center', title:'安全阀类型', hide:true},
                {field:'manu_date', width:50, align:'center', title:'出厂日期', hide:true,sort:true},
                {field:'press_class_range', width:110, align:'center', title:'压力级别范围MPa', hide:true,templet : function(row){
                    return row.press_class_range_min + ' - ' + row.press_class_range_max
                }},


            ];
            var local = layui.data('table-wait_test'); // 获取对应的本地记录
            layui.each(cols, function(index, item) {
                if (item.field in local) {
                    item.hide = local[item.field];
                }
            });
            return cols;
        }()],
        done: function() {
            updateSelectedCount();
            // 记录筛选状态
            var that = this;
            that.elem.next().on('mousedown', 'input[lay-filter="LAY_TABLE_TOOL_COLS"]+', function() {
                var input = $(this).prev()[0];
                // 此处表名可任意定义
                layui.data('table-wait_test', {
                    key: input.name,
                    value: input.checked
                })
            });
        }
    });

    var nowTableName = 'wait_test';

    table.on('sort(test)', function(obj){
        var orderName = 's.' + obj.field;

        switch(obj.field) {
            case 'status_name':
                orderName = 's.status';
                break;
        }

        layui.data('table_orderby',  {
            key: nowTableName,
            value: {
                orderby : orderName + ' ' + obj.type,
                field: obj.field,
                type: obj.type
            }
        });
        table.reload('dataTable', {
            initSort: obj, // 记录初始排序，如果不设的话，将无法标记表头的排序状态。
            where: $.extend(true,tableWhere,{
                orderby : orderName + ' ' + obj.type
            })
        });
    });
    var local_orderby = layui.data('table_orderby')
    if(local_orderby[nowTableName])
    {
        table.reload('dataTable', {
            initSort: local_orderby[nowTableName], // 记录初始排序，如果不设的话，将无法标记表头的排序状态。
            where: $.extend(true,tableWhere,{
                orderby : local_orderby[nowTableName]['orderby']
            })
        });
    }
    
    table.on('tool(test)', function(obj){
         var data = obj.data;
         if (obj.event == 'tijiao') {
            layer.confirm('确认要提交吗？',function(index){
                  //发异步删除数据
                  $.ajax({
                    url: '/examination/workorder/workorder_status',
                    type: 'post',
                    data: { "id": data.id,'status':2},
                    dataType: 'json',
                    success: function(data) {
                        if (data.code == 0) {
                            obj.del();
                            layer.msg('成功',{icon:1,time:1000});
                        } else {
                         return layer.msg(data.message,{icon: 5,anim: 6});
                        }
                    },
                    error: function(data) {
                        layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                    }
                });
                  
              });
         }
    })

    table.on('checkbox(test)', function(){
        updateSelectedCount();
    });
    table.on('checkbox(all)', function(){
        updateSelectedCount();
    });

    function updateSelectedCount() {
        var checkStatus = table.checkStatus('dataTable'); // 获取选中行数据
        var selectedCount = checkStatus.data.length; // 计算选中条数
        $('#selectedCount').text(selectedCount); // 更新显示
    }

    //头工具栏事件
    table.on('toolbar(test)',function(obj) {
        console.log(obj);
        if (obj.event == 'all_tijiao') {
            var checkStatus = table.checkStatus(obj.config.id),
            data = checkStatus.data;
            var ids = [];


            $.each(data,function(index, el) {
                ids.push(el.id);
            });

            ids = ids.join(',');

            if (data.length === 0) {
                layer.msg('请最少选择一行', {
                    icon: 5,
                    anim: 6
                });
                return
            }

            layer.confirm('确认要提交吗？',function(index){
                  //发异步删除数据
                  $.ajax({
                    url: '/examination/workorder/workorder_tijiao_piliang',
                    type: 'post',
                    data: { "id": ids },
                    dataType: 'json',
                    success: function(data) {
                        console.log(data)
                        if (data.code == 0) {
                            layer.close(index);
                            layer.msg('成功', {
                                icon: 6,
                                time: 1000,
                            }, function(){
                                // 页面刷新
                                xadmin.tab('/examination/workorder/under_inspection');
                                location.reload();
                            });
                        } else {
                            return layer.msg(data.message,{icon: 5,anim: 6});
                        }
                    },
                    error: function(data) {
                        layer.msg(data.responseJSON.message,{icon: 5,anim: 6});
                    }
                });
                  
              });
         }

        var checkStatus = table.checkStatus(obj.config.id);
        switch (obj.event) {
        case 'getCheckData':
            var data = checkStatus.data;
            layer.alert(JSON.stringify(data));
            break;
        case 'getCheckLength':
            var data = checkStatus.data;
            layer.msg('选中了：' + data.length + ' 个');
            break;
        case 'isAll':
            console.log(checkStatus)
            if (checkStatus.data.length > 0) {
            let cust_id_list = [];
            let ids = '';
            for (var i = 0; i < checkStatus.data.length; i++) {
                if (cust_id_list.indexOf(checkStatus.data[i].cust_id) > -1) {
                }else{
                    cust_id_list.push(checkStatus.data[i].cust_id)
                }
                ids += checkStatus.data[i].id+',';
            }
            if (cust_id_list.length > 1) {
                layer.msg('请选择同一单位数据',{icon: 5,anim: 6});
                return
            }
            // xadmin.open('编辑','./weituodan_add.html?cust_id='+cust_id_list[0]+'&id='+ids,1200)
            parent.xadmin.add_tab('委托单列表','/examination/commission/commission_list.html?cust_id='+cust_id_list[0]+'&id='+ids+'&xian=1')
            }else{
               layer.msg('请选择数据',{icon: 5,anim: 6});
                return
            }
        };
    });
});
</script>
